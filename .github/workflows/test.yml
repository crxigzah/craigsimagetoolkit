name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        module: [compress, resize, blur, remove-bg, gui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system Tk (gui only)
        if: matrix.module == 'gui'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb

      - name: Cache rembg models
        if: matrix.module == 'remove-bg' || matrix.module == 'gui'
        uses: actions/cache@v4
        with:
          path: ~/.rembg
          key: rembg-models

      - name: Install dependencies
        run: |
          pip install -r ${{ matrix.module }}/requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          if [ "${{ matrix.module }}" = "gui" ]; then
            xvfb-run --auto-servernum python -m pytest ${{ matrix.module }}/tests/ -v
          else
            python -m pytest ${{ matrix.module }}/tests/ -v
          fi
