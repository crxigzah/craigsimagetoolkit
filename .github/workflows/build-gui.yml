name: Build GUI

on:
  push:
    tags:
      - 'gui-v*'
  workflow_dispatch: {}

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r gui/requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller app.spec
        working-directory: gui

      # Building successfully is not enough on its own -- a frozen build
      # can still crash the instant it launches (an import-time error deep
      # inside a bundled dependency, e.g. missing package metadata; see
      # app.spec's copy_metadata('pymatting') comment for a real one this
      # caught). --self-test builds the actual window and exits instead of
      # opening it, so this runs against the real .exe on a real Windows
      # machine before anything gets published.
      - name: Smoke test the built exe
        shell: pwsh
        run: |
          $output = & "dist\craigsimagetoolkit.exe" --self-test 2>&1 | Out-String
          Write-Output $output
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Self-test exited with code $LASTEXITCODE"
            exit 1
          }
          if ($output -notmatch "SELF-TEST OK") {
            Write-Error "Self-test did not print SELF-TEST OK"
            exit 1
          }
        working-directory: gui

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: craigsimagetoolkit-windows
          path: gui/dist/craigsimagetoolkit.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/gui-v')
        uses: softprops/action-gh-release@v2
        with:
          files: gui/dist/craigsimagetoolkit.exe
